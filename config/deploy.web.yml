service: dojo-web
image: <%= ENV["GITHUB_USERNAME"] %>/dojo-web

ssh:
  user: deploy

servers:
  web:
    hosts:
      - <%= ENV["HOST_IP"] %>

proxy:
  ssl: false
  host: "<%= ENV["WEB_URL"].to_s.sub(%r{^https?://}, "") %>"
  app_port: 80
  healthcheck:
    interval: 10
    path: /health
    timeout: 5

registry:
  server: ghcr.io
  username: <%= ENV["GITHUB_USERNAME"] %>
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  context: .
  dockerfile: apps/web/Dockerfile
  arch: amd64
  args:
    VITE_API_URL: "<%= ENV.fetch("API_URL", "") %>"
    VITE_SENTRY_DSN: "<%= ENV.fetch("VITE_SENTRY_DSN", "") %>"
    VITE_SENTRY_ENVIRONMENT: "<%= ENV.fetch("VITE_SENTRY_ENVIRONMENT", "production") %>"
    VITE_SENTRY_RELEASE: "<%= ENV.fetch("VITE_SENTRY_RELEASE", "") %>"
    VITE_TURNSTILE_SITE_KEY: "<%= ENV.fetch("TURNSTILE_SITE_KEY", "") %>"
    SENTRY_AUTH_TOKEN: "<%= ENV.fetch("SENTRY_AUTH_TOKEN", "") %>"
    SENTRY_ORG: "<%= ENV.fetch("SENTRY_ORG", "") %>"
    SENTRY_PROJECT: "<%= ENV.fetch("SENTRY_PROJECT", "") %>"
  cache:
    type: gha

logging:
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

aliases:
  shell: app exec --interactive 'sh'
  logs: app logs -f
