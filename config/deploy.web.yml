<% app_host = ENV["APP_HOST"].to_s.strip %>
<% raise "APP_HOST must be set to the instance's public web hostname" if app_host.empty? %>
<% api_host = ENV["API_HOST"].to_s.strip %>
<% raise "API_HOST must be set to the instance's public API hostname" if api_host.empty? %>
<% host_ip = ENV["HOST_IP"].to_s.strip %>
<% raise "HOST_IP must be set to the server's address" if host_ip.empty? %>
<% owner = ENV["GITHUB_REPOSITORY_OWNER"].to_s.strip.downcase %>
<% raise "GITHUB_REPOSITORY_OWNER must be set to the GHCR owner of the image" if owner.empty? %>
service: dojo-web
image: <%= owner %>/dojo-web

ssh:
  user: deploy

servers:
  web:
    hosts:
      - <%= host_ip %>

proxy:
  ssl: false
  host: "<%= app_host %>"
  app_port: 80
  healthcheck:
    interval: 10
    path: /health
    timeout: 5

env:
  clear:
    # nginx writes it into the CSP connect-src at container start.
    API_HOST: "<%= api_host %>"

registry:
  server: ghcr.io
  username: <%= ENV.fetch("GITHUB_ACTOR") %>
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  context: .
  dockerfile: apps/web/Dockerfile
  arch: amd64
  args:
    VITE_API_URL: "https://<%= api_host %>"
    VITE_APP_HOST: "<%= app_host %>"
    VITE_SENTRY_DSN: "<%= ENV.fetch("VITE_SENTRY_DSN", "") %>"
    VITE_SENTRY_ENVIRONMENT: "<%= ENV.fetch("VITE_SENTRY_ENVIRONMENT", "production") %>"
    VITE_SENTRY_RELEASE: "<%= ENV.fetch("VITE_SENTRY_RELEASE", "") %>"
    VITE_TURNSTILE_SITE_KEY: "<%= ENV.fetch("TURNSTILE_SITE_KEY", "") %>"
    SENTRY_AUTH_TOKEN: "<%= ENV.fetch("SENTRY_AUTH_TOKEN", "") %>"
    SENTRY_ORG: "<%= ENV.fetch("SENTRY_ORG", "") %>"
    SENTRY_PROJECT: "<%= ENV.fetch("SENTRY_PROJECT", "") %>"
  cache:
    type: gha

logging:
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

aliases:
  shell: app exec --interactive 'sh'
  logs: app logs -f
