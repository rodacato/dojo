services:
  workspace:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    # tini as PID 1 — `sleep infinity` never reaps, so git/node/claude zombies pile up.
    init: true
    volumes:
      - ..:/workspaces/dojo:cached
      # The shell-history feature writes here (/dc/shellhistory, per its
      # devcontainer-feature.json); without the volume every rebuild starts empty.
      - commandhistory:/dc/shellhistory
    # .host.env comes from initialize.sh, local.env from you; the later file wins. See README.md.
    env_file:
      - path: .host.env
        required: false
      - path: local.env
        required: false
    command: sleep infinity
    depends_on:
      - db
      - piston

  # No host ports on db or piston: the workspace reaches both over the compose network, and
  # forwardPorts exposes db on a free local port, so repos sharing a host never collide.
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dojo
      POSTGRES_PASSWORD: dojo
      POSTGRES_DB: dojo_dev
    volumes:
      - postgres-data:/var/lib/postgresql/data

  piston:
    image: ghcr.io/engineer-man/piston
    platform: linux/amd64
    restart: unless-stopped
    privileged: true
    cgroup: host
    environment:
      PISTON_RUN_TIMEOUT: 15000
      PISTON_COMPILE_TIMEOUT: 30000
      # Mirror prod's raised stdout cap (config/deploy.api.yml: 65536). The 1024
      # default makes the local validate:scrolls smoke stricter than prod — it
      # false-fails many-test steps (e.g. ruby parameters_of) on output size.
      PISTON_OUTPUT_MAX_SIZE: 65536
      PISTON_LIMIT_OVERRIDES: '{"typescript":{"run_timeout":15000},"python":{"run_timeout":15000},"ruby":{"run_timeout":15000},"go":{"run_timeout":15000}}'
    # Override entrypoint to use mkdir -p so container restarts don't fail
    # when /sys/fs/cgroup/isolate/ already exists from a previous run.
    entrypoint:
      - /bin/bash
      - -c
      - |
        cd /sys/fs/cgroup
        rmdir isolate/init 2>/dev/null || true
        rmdir isolate/ 2>/dev/null || true
        mkdir isolate/
        echo 1 > isolate/cgroup.procs
        echo '+cpuset +cpu +io +memory +pids' > cgroup.subtree_control
        cd isolate
        mkdir init
        echo 1 > init/cgroup.procs
        echo '+cpuset +memory' > cgroup.subtree_control
        echo "Initialized cgroup"
        chown -R piston:piston /piston
        exec su -- piston -c 'ulimit -n 65536 && node /piston_api/src'
    tmpfs:
      - /piston/jobs:exec,size=256m

volumes:
  postgres-data:
  commandhistory:
