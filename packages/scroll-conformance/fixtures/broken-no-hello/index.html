<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Broken scroll: no hello</title>
  </head>
  <body>
    <p>This scroll never says hello.</p>
    <script>
      var host = new URLSearchParams(location.search).get('host')
      var nonce = Array.from(crypto.getRandomValues(new Uint8Array(16)), function (b) {
        return b.toString(16).padStart(2, '0')
      }).join('')
      var session = null

      function send(message) {
        var envelope = Object.assign({ dojo: 'scroll', v: 0 }, session ? { session: session } : {})
        parent.postMessage(Object.assign(envelope, message), host)
      }

      addEventListener('message', function (event) {
        if (event.origin !== host || event.source !== parent) return
        var data = event.data
        if (!data || data.dojo !== 'scroll' || data.type !== 'init' || data.nonce !== nonce || session) return
        session = data.session
        send({ type: 'progress', unitId: 'unit-1', state: {} })
      })

      // Defect: the hello that starts the handshake is never sent.
    </script>
  </body>
</html>
