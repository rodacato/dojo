name: CD · Smoke

# Smoke tests hit a real deployed environment and use a pre-issued bearer
# token. They are intentionally not wired to PR/push so a broken secret never
# blocks merges. They run nightly against prod, and on demand for either
# environment. A red nightly sends GitHub's native failed-workflow notification
# and opens no issue: the repo is public and a failing test can describe a
# weakness. See docs/specs/027-sprint-022-playground.md §3.

on:
  schedule:
    - cron: '0 9 * * *' # 09:00 UTC, after the nightly E2E at 08:00
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'prod'
        type: choice
        options:
          - prod
          - staging

permissions:
  contents: read

# Queue, never cancel: a smoke cut short against a live environment reads as a false red.
concurrency:
  group: cd-smoke-${{ inputs.environment || 'prod' }}
  cancel-in-progress: false

jobs:
  smoke:
    name: Deployed smoke (${{ inputs.environment || 'prod' }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ${{ inputs.environment == 'staging' && 'staging' || 'production' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.9

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run smoke suite
        run: pnpm --filter=@dojo/e2e test:deployed
        env:
          CI: 'true'
          SMOKE_BASE_URL: https://${{ vars.APP_HOST }}
          SMOKE_API_URL: https://${{ vars.API_HOST }}
          SMOKE_AUTH_TOKEN: ${{ secrets.SMOKE_AUTH_TOKEN }}
          SMOKE_PUBLIC_USERNAME: ${{ vars.SMOKE_PUBLIC_USERNAME }}
          # '1' only on a target whose API runs LLM_ADAPTER_FORMAT=mock.
          SMOKE_USE_MOCK_LLM: ${{ vars.SMOKE_USE_MOCK_LLM }}

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-traces-${{ inputs.environment || 'prod' }}
          path: apps/e2e/test-results/
          retention-days: 7
