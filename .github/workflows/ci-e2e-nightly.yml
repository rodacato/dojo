name: CI · E2E Nightly

# The whole local e2e suite. PRs only run the @smoke subset (ci.yml, job "E2E Smoke").
# A red nightly sends GitHub's native failed-workflow notification and opens no issue:
# the repo is public and a failing test can describe a weakness.
#
# Before a release, run it on the release branch:
#   gh workflow run ci-e2e-nightly.yml --ref release/vX.Y.Z
# (RELEASING.md, step 3).

on:
  schedule:
    - cron: '0 8 * * *' # 08:00 UTC, early morning in Mexico
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-full:
    name: E2E Full
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.15.4 # must match packageManager in root package.json

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter=@dojo/e2e exec playwright install --with-deps chromium

      - name: Run the full E2E suite
        run: pnpm --filter=@dojo/e2e test
        env:
          CI: 'true'

      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-traces-full
          path: apps/e2e/test-results/
          retention-days: 7
