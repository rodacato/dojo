name: CI · Quality

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

env:
  # Report-only: findings show in the job log without failing the check.
  # Set to "true" to make Semgrep, Trivy and Gitleaks block a merge.
  SECURITY_BLOCKING: "false"

jobs:
  semgrep:
    name: semgrep (SAST)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep # zizmor: ignore[unpinned-images] floats so the rules stay current; Dependabot cannot bump it
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Scan
        continue-on-error: ${{ env.SECURITY_BLOCKING != 'true' }}
        run: semgrep scan --config p/default --config p/security-audit --error

  trivy:
    name: trivy (deps + secrets + IaC)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        continue-on-error: ${{ env.SECURITY_BLOCKING != 'true' }}
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        continue-on-error: ${{ env.SECURITY_BLOCKING != 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Free for personal accounts; a repo under an organization needs this secret.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  actionlint:
    name: actionlint (workflow syntax)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Lint workflows
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12 -color

  zizmor:
    name: zizmor (workflow security)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Audit workflows
        uses: zizmorcore/zizmor-action@f9597c869b2e67095f9b527070297a13a6efe928 # v0.7.0
        with:
          version: 1.31.0
          collect: workflows
          min-severity: medium
          advanced-security: false
          annotations: true

  sonar:
    # Opt-in and manual: runs on "Run workflow" only, and only where a SonarQube
    # server is configured (SONAR_HOST_URL variable + SONAR_TOKEN secret).
    # Monorepo → one Sonar project per workspace (own bridge = lower memory).
    # Each app has its own sonar-project.properties; scanned via projectBaseDir.
    # Vitest thresholds are neutralized (VITEST_NO_COVERAGE_THRESHOLD) so a low
    # number still feeds Sonar; gating stays in CI's test job.
    if: ${{ github.event_name == 'workflow_dispatch' && vars.SONAR_HOST_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0 # full history → accurate "new code" / blame dates

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.15.4 # must match packageManager in root package.json

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run api tests with coverage
        run: pnpm --filter=@dojo/api test:coverage
        env:
          VITEST_NO_COVERAGE_THRESHOLD: "1" # report coverage, don't gate on it
          DATABASE_URL: postgresql://dojo:dojo@localhost:5432/dojo_test
          SESSION_SECRET: ci-test-secret-minimum-32-characters-long
          GITHUB_CLIENT_ID: ci-test-client-id
          GITHUB_CLIENT_SECRET: ci-test-client-secret
          GITHUB_CALLBACK_URL: http://localhost:3001/auth/github/callback
          LLM_ADAPTER_FORMAT: mock
          LLM_BASE_URL: http://localhost:11434
          LLM_API_KEY: ci-test-api-key
          WEB_URL: http://localhost:5173
          NODE_ENV: test

      - name: Run web tests with coverage
        run: pnpm --filter=@dojo/web test:coverage

      - name: Run shared tests with coverage
        run: pnpm --filter=@dojo/shared test:coverage

      # One Sonar project per workspace. web's react type graph is the OOM risk
      # that once got it dropped — mitigated by the per-workspace bridge +
      # maxspace ceiling in its sonar-project.properties; bump that if it OOMs.
      - name: Scan api
        uses: sonarsource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        with:
          projectBaseDir: apps/api
          args: -Dsonar.projectVersion=${{ github.sha }}
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Scan web
        uses: sonarsource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        with:
          projectBaseDir: apps/web
          args: -Dsonar.projectVersion=${{ github.sha }}
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Scan shared
        uses: sonarsource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        with:
          projectBaseDir: packages/shared
          args: -Dsonar.projectVersion=${{ github.sha }}
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
