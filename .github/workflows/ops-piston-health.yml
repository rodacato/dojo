name: Ops · Piston Health

# check: /health/piston, alerts on 2 consecutive misses (ADR 019; recovery: scripts/piston-reprovision.sh).
# smoke: real execute per language, catches what a 200 from /health/piston hides (compile-timeout regression).

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read

# A run still going when the next tick fires is stale; the newer probe wins.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  check:
    name: Check /health/piston
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: First probe
        id: probe1
        env:
          HEALTH_URL: ${{ vars.PISTON_HEALTH_URL }}
        run: |
          set -uo pipefail
          response=$(mktemp)
          status=$(curl -sS -o "$response" -w '%{http_code}' --max-time 10 "$HEALTH_URL" || echo 000)
          echo "first status=$status"
          cat "$response" || true
          echo ""
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Wait 30s before retry
        if: steps.probe1.outputs.status != '200'
        run: sleep 30

      - name: Second probe
        id: probe2
        if: steps.probe1.outputs.status != '200'
        env:
          HEALTH_URL: ${{ vars.PISTON_HEALTH_URL }}
        run: |
          set -uo pipefail
          response=$(mktemp)
          status=$(curl -sS -o "$response" -w '%{http_code}' --max-time 10 "$HEALTH_URL" || echo 000)
          echo "second status=$status"
          cat "$response" || true
          echo ""
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Fail if two consecutive probes failed
        if: steps.probe1.outputs.status != '200' && steps.probe2.outputs.status != '200'
        env:
          FIRST_STATUS: ${{ steps.probe1.outputs.status }}
          SECOND_STATUS: ${{ steps.probe2.outputs.status }}
        run: |
          echo "::error title=Piston down::2 consecutive /health/piston probes failed ($FIRST_STATUS, $SECOND_STATUS). Recovery: ./scripts/piston-reprovision.sh"
          exit 1

  smoke:
    name: Execute one hello-world per language
    runs-on: ubuntu-latest
    # CRON_SECRET is production-scoped: without the environment it reads empty and every run 401s.
    environment: production
    timeout-minutes: 3
    steps:
      - name: Call /cron/piston-smoke
        env:
          API_HOST: ${{ vars.API_HOST }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -uo pipefail
          response=$(mktemp)
          status=$(curl -sS -o "$response" -w '%{http_code}' --max-time 90 \
            -X POST "https://$API_HOST/cron/piston-smoke" \
            -H "Authorization: Bearer $CRON_SECRET" || echo 000)
          echo "status=$status"
          echo "--- body ---"
          cat "$response" 2>/dev/null || true
          echo ""
          if [ "$status" != "200" ]; then
            echo "::error title=Piston execute smoke failed::endpoint returned $status — at least one language failed end-to-end. See body above for per-language detail."
            exit 1
          fi
