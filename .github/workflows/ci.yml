name: CI · Test

# Pull requests only: the master ruleset requires a branch up to date with master, so the commit a
# merge lands has already passed here and a push run would repeat it.
on:
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true # cancel stale runs on new pushes to the same branch

jobs:
  ci:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        # Same major as production (config/deploy.api.yml); the integration tests need a real server.
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dojo
          POSTGRES_PASSWORD: dojo
          POSTGRES_DB: dojo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dojo -d dojo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.9 # must match packageManager in root package.json

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test release tooling
        # The changelog generator is not in a workspace, so `turbo test` never walks it.
        run: pnpm test:scripts

      - name: Test api (enforced coverage gate)
        # Runs coverage so the vitest.config threshold gates here (the Sonar job
        # neutralizes it via VITEST_NO_COVERAGE_THRESHOLD; this job does not, so
        # the honest ratcheting floor is enforced). E2E runs in its own job.
        run: pnpm --filter=@dojo/api test:coverage
        env:
          # Provide test env vars so config.ts validation passes
          DATABASE_URL: postgresql://dojo:dojo@localhost:5432/dojo_test
          SESSION_SECRET: ci-test-secret-minimum-32-characters-long
          GITHUB_CLIENT_ID: ci-test-client-id
          GITHUB_CLIENT_SECRET: ci-test-client-secret
          GITHUB_CALLBACK_URL: http://localhost:3001/auth/github/callback
          LLM_ADAPTER_FORMAT: mock
          LLM_BASE_URL: http://localhost:11434
          LLM_API_KEY: ci-test-api-key
          WEB_URL: http://localhost:5173
          NODE_ENV: test
          # Integration tests run raw SQL against the service above; REQUIRE makes a missing database fail, not skip.
          TEST_DATABASE_URL: postgresql://dojo:dojo@localhost:5432/dojo_test
          REQUIRE_DB_TESTS: '1'

      - name: Test web (enforced coverage gate)
        # Gate was decorative before S034 — the threshold lived in vitest.config
        # but CI never ran it. Now enforced here, same as api.
        run: pnpm --filter=@dojo/web test:coverage

      - name: Test shared (enforced coverage gate)
        run: pnpm --filter=@dojo/shared test:coverage

  e2e-smoke:
    name: E2E Smoke
    # Not a required check yet: promote it in the master ruleset once it has proven stable.
    # The full suite runs nightly and before a release (ci-e2e-nightly.yml).
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.9 # must match packageManager in root package.json

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter=@dojo/e2e exec playwright install --with-deps chromium

      - name: Run E2E smoke
        # playwright.config.ts starts the web dev server itself and mocks the API.
        run: pnpm --filter=@dojo/e2e test:smoke
        env:
          CI: 'true'

      - name: Scroll conformance
        # Audits the reference scroll (apps/e2e/fixtures/reference-scroll) in a real browser.
        run: pnpm --filter=@dojo/e2e conformance

      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-traces-smoke
          path: apps/e2e/test-results/
          retention-days: 7
